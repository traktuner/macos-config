### General Configuration for macOS Setup
### Used by various utility scripts

# ─────────────────────────────────────────────────────────────────────────────
# SMB Configuration for SSH Keys (used by 04-ssh-keys.sh)
# ─────────────────────────────────────────────────────────────────────────────
SMB_SERVER="172.16.10.200"
SMB_USER_PATH="tom/tresor/ssh"
SMB_MOUNT_POINT="/Volumes/ssh"

# ─────────────────────────────────────────────────────────────────────────────
# Wallpaper Configuration (used by 03-macos.sh)
# ─────────────────────────────────────────────────────────────────────────────
WALLPAPER_PATH="$HOME/Library/Mobile Documents/com~apple~CloudDocs/wallpaper/default.jpeg"

# ─────────────────────────────────────────────────────────────────────────────
# Time Machine Configuration
# ─────────────────────────────────────────────────────────────────────────────
TM_ENABLED=true
TM_AUTO_BACKUP=true

# ─────────────────────────────────────────────────────────────────────────────
# Pre-reinstall Backup (used by 06-backup-before-reinstall.sh)
# ─────────────────────────────────────────────────────────────────────────────
# Sub-path below the mounted share (~/Netzlaufwerke) used as backup
# destination. Override per run with BACKUP_DESTINATION or by passing the
# destination as the second script argument.
BACKUP_RESTORE_SUBPATH="tom/restore/2026"

# ─────────────────────────────────────────────────────────────────────────────
# SMB Configuration for AI tool configs (used by 12-ai-config.sh)
#   Layout on the share:  <SMB_AI_PATH>/claude  /codex  /opencode
#   These configs (incl. secrets like the Lumo apiKey / Codex auth.json) live
#   ONLY on the private share, never in this public repo.
# ─────────────────────────────────────────────────────────────────────────────
SMB_AI_PATH="tom/tresor/ai-config"
SMB_AI_MOUNT_POINT="/Volumes/ai-config"

# T3 Xcode worker (used by 14-xcode-worker.sh). The T3 container later sets
# the permitted workspace root through its restricted-key handshake.
T3_XCODE_WORKER_ENABLED=true
T3_XCODEBUILDMCP_VERSION="2.6.2"
# Keep Remote Login unchanged unless this Mac should accept the T3 host over SSH.
T3_XCODE_ENABLE_REMOTE_LOGIN=false

# ─────────────────────────────────────────────────────────────────────────────
# Infra harness source (used by 15-agent-rack.sh). The authoritative package
# owns agent-rack policies, profiles, skills, client rules, and registration.
# It also supplies the pinned agent-rack runtime lock used by the local wrapper.
# ─────────────────────────────────────────────────────────────────────────────
# Override per run with INFRA_HARNESS_SOURCE. Do not point this at a copied
# policy directory: it must be an Infra checkout that contains the installer.
INFRA_HARNESS_SOURCE="$HOME/Netzlaufwerke/developer/repos/infra/infra"
